<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HW-Collector icono">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1b2740"/>
      <stop offset="55%"  stop-color="#101828"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b71000"/>
      <stop offset="32%"  stop-color="#ff3d00"/>
      <stop offset="68%"  stop-color="#ff7300"/>
      <stop offset="100%" stop-color="#ffc400"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#fff3b0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff6b8"/>
      <stop offset="20%"  stop-color="#ffd83d"/>
      <stop offset="58%"  stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="48%"  stop-color="#f2f7fc"/>
      <stop offset="52%"  stop-color="#cfdcea"/>
      <stop offset="100%" stop-color="#8fa3ba"/>
    </linearGradient>
  </defs>

  <!-- fondo redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ff4d00" stroke-width="6" opacity="0.55"/>

  <!-- contenido centrado y escalado -->
  <g transform="translate(256,256) scale(1.22) translate(-256,-256)">
  <!-- flama centrada arriba -->
  <g transform="translate(96,66) scale(0.62)">
    <path d="M 46 372
             C 18 300 62 224 146 186
             C 126 232 140 268 182 274
             C 168 216 216 152 296 124
             C 266 176 280 216 328 226
             C 320 172 366 112 452 86
             C 410 142 428 194 486 206
             C 500 262 474 330 412 368
             C 322 424 128 438 46 372 Z"
          fill="#0b0f16" stroke="#0b0f16" stroke-width="26" stroke-linejoin="round"/>
    <path d="M 46 372
             C 18 300 62 224 146 186
             C 126 232 140 268 182 274
             C 168 216 216 152 296 124
             C 266 176 280 216 328 226
             C 320 172 366 112 452 86
             C 410 142 428 194 486 206
             C 500 262 474 330 412 368
             C 322 424 128 438 46 372 Z"
          fill="url(#flameGrad)"/>
    <path d="M 150 330
             C 138 292 168 252 214 232
             C 202 262 214 288 246 292
             C 240 258 268 220 318 202
             C 296 238 306 268 342 276
             C 348 316 322 352 280 368
             C 232 386 172 376 150 330 Z"
          fill="url(#flameInner)" opacity="0.92"/>
  </g>

  <!-- HW -->
  <g transform="translate(256,392) skewX(-11)">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="190" font-weight="900" letter-spacing="-4"
          fill="#0b0f16" stroke="#0b0f16" stroke-width="26" stroke-linejoin="round">HW</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="190" font-weight="900" letter-spacing="-4"
          fill="#ffffff" stroke="#ffffff" stroke-width="15" stroke-linejoin="round">HW</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="190" font-weight="900" letter-spacing="-4"
          fill="url(#gold)">HW</text>
  </g>
  </g>
</svg>
