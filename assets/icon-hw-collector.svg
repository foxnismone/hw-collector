<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HW-Collector icono">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2E"/>
      <stop offset="40%" stop-color="#D9001B"/>
      <stop offset="100%" stop-color="#8B000F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="35%" stop-color="#FFCC00"/>
      <stop offset="70%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="clubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="55%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- banner rojo de fondo -->
  <g filter="url(#ds)">
    <path d="M 30 290
             C 80 220 220 175 330 175
             C 420 175 470 205 490 250
             C 500 280 500 310 490 340
             C 470 385 420 410 330 410
             C 220 410 80 375 30 325
             C 18 310 18 300 30 290 Z"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="16" stroke-linejoin="round"/>
    <path d="M 30 290
             C 80 220 220 175 330 175
             C 420 175 470 205 490 250
             C 500 280 500 310 490 340
             C 470 385 420 410 330 410
             C 220 410 80 375 30 325
             C 18 310 18 300 30 290 Z"
          fill="url(#redGrad)"/>
  </g>

  <!-- HW en llamas -->
  <g filter="url(#ds)">
    <path d="M 15 245
             C 5 205 35 165 90 145
             C 78 170 90 190 118 197
             C 110 165 138 130 185 116
             C 168 147 177 175 208 182
             C 203 148 230 112 278 100
             C 257 132 265 163 303 171
             C 312 200 296 232 260 252
             C 208 276 112 285 15 260
             C 6 254 6 250 15 245 Z"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="22" stroke-linejoin="round"/>
    <path d="M 15 245
             C 5 205 35 165 90 145
             C 78 170 90 190 118 197
             C 110 165 138 130 185 116
             C 168 147 177 175 208 182
             C 203 148 230 112 278 100
             C 257 132 265 163 303 171
             C 312 200 296 232 260 252
             C 208 276 112 285 15 260
             C 6 254 6 250 15 245 Z"
          fill="url(#goldGrad)"/>
    <path d="M 90 233
             C 82 211 102 188 129 176
             C 123 196 131 211 151 215
             C 147 194 167 171 200 161
             C 187 183 193 204 218 211
             C 224 233 209 251 184 259
             C 154 269 116 263 90 233 Z"
          fill="#FFF3B0" opacity="0.9"/>
  </g>

  <!-- -Collector blanco -->
  <g transform="translate(200,250) skewX(-10)"
     font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif" font-size="95"
     font-weight="900" letter-spacing="-3">
    <text x="0" y="0" fill="#0B0F16" stroke="#0B0F16" stroke-width="14" stroke-linejoin="round">-Collector</text>
    <text x="0" y="0" fill="#FFFFFF" stroke="#0B0F16" stroke-width="4" stroke-linejoin="round">-Collector</text>
  </g>

  <!-- Collectors Community -->
  <g transform="translate(360,340)">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="15" font-weight="900" letter-spacing="1.2"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="3" stroke-linejoin="round">Collectors Community</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="15" font-weight="900" letter-spacing="1.2"
          fill="#FFFFFF">Collectors Community</text>
  </g>

  <!-- COLLECTOR'S CLUB -->
  <g transform="translate(360,390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="34" font-weight="900" font-style="italic"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="6" stroke-linejoin="round">COLLECTOR'S CLUB</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="34" font-weight="900" font-style="italic"
          fill="url(#clubGrad)" stroke="#0B0F16" stroke-width="2.5" stroke-linejoin="round">COLLECTOR'S CLUB</text>
  </g>
</svg>
