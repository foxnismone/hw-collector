<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="HW-Collector">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2E"/>
      <stop offset="40%" stop-color="#D9001B"/>
      <stop offset="100%" stop-color="#8B000F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="35%" stop-color="#FFCC00"/>
      <stop offset="70%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <linearGradient id="clubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE44D"/>
      <stop offset="55%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ===== BANNER ROJO CURVO ===== -->
  <g filter="url(#ds)">
    <path d="M 55 345
             C 120 265 300 212 475 212
             C 640 212 760 252 830 302
             C 852 332 852 372 830 402
             C 760 452 640 482 475 482
             C 300 482 120 442 55 382
             C 35 362 35 352 55 345 Z"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="18" stroke-linejoin="round"/>
    <path d="M 55 345
             C 120 265 300 212 475 212
             C 640 212 760 252 830 302
             C 852 332 852 372 830 402
             C 760 452 640 482 475 482
             C 300 482 120 442 55 382
             C 35 362 35 352 55 345 Z"
          fill="url(#redGrad)"/>
    <path d="M 130 282
             C 220 232 380 212 540 220
             C 680 228 780 260 820 298"
          fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ===== TEXTO DENTRO DEL BANNER ===== -->
  <g transform="translate(472,286)">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="18" font-weight="900" letter-spacing="2.2"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="4" stroke-linejoin="round">Collectors Community</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="18" font-weight="900" letter-spacing="2.2"
          fill="#FFFFFF">Collectors Community</text>
  </g>
  <g transform="translate(472,358)">
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="52" font-weight="900" font-style="italic" letter-spacing="0.5"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="9" stroke-linejoin="round">COLLECTOR'S CLUB</text>
    <text x="0" y="0" text-anchor="middle" font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif"
          font-size="52" font-weight="900" font-style="italic" letter-spacing="0.5"
          fill="url(#clubGrad)" stroke="#0B0F16" stroke-width="3.5" stroke-linejoin="round">COLLECTOR'S CLUB</text>
  </g>

  <!-- ===== HW EN LLAMAS (apuntando a la izquierda) ===== -->
  <g filter="url(#ds)">
    <path d="M 35 285
             C 15 235 55 185 125 160
             C 110 190 125 215 160 223
             C 150 185 185 140 245 123
             C 223 163 235 195 273 203
             C 267 163 300 120 360 105
             C 333 145 345 183 393 193
             C 405 230 385 270 340 295
             C 275 325 155 335 35 305
             C 20 297 20 293 35 285 Z"
          fill="#0B0F16" stroke="#0B0F16" stroke-width="24" stroke-linejoin="round"/>
    <path d="M 35 285
             C 15 235 55 185 125 160
             C 110 190 125 215 160 223
             C 150 185 185 140 245 123
             C 223 163 235 195 273 203
             C 267 163 300 120 360 105
             C 333 145 345 183 393 193
             C 405 230 385 270 340 295
             C 275 325 155 335 35 305
             C 20 297 20 293 35 285 Z"
          fill="url(#goldGrad)"/>
    <path d="M 125 270
             C 115 243 140 215 175 200
             C 167 225 177 245 203 250
             C 198 223 223 195 265 183
             C 247 211 255 237 287 245
             C 295 273 275 297 243 307
             C 205 320 157 313 125 270 Z"
          fill="#FFF3B0" opacity="0.9"/>
  </g>

  <!-- ===== "-Collector" BLANCO ===== -->
  <g transform="translate(415,288) skewX(-10)"
     font-family="'Arial Black','Arial Bold',Impact,Arial,sans-serif" font-size="125"
     font-weight="900" letter-spacing="-4">
    <text x="0" y="0" fill="#0B0F16" stroke="#0B0F16" stroke-width="17" stroke-linejoin="round">-Collector</text>
    <text x="0" y="0" fill="#FFFFFF" stroke="#0B0F16" stroke-width="5" stroke-linejoin="round">-Collector</text>
  </g>

  <!-- ===== decoración: pista loop ===== -->
  <g opacity="0.30" transform="translate(630,55)">
    <path d="M 65 185 C 25 85 105 25 185 65 C 265 105 245 205 165 225 C 105 240 65 215 65 185 Z"
          fill="none" stroke="#FF6A00" stroke-width="11" stroke-linecap="round"/>
    <path d="M 65 185 C 25 85 105 25 185 65 C 265 105 245 205 165 225 C 105 240 65 215 65 185 Z"
          fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
